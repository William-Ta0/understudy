# Open a share sub-account for a member
# Capability artifact - understudy/capability@1. Generated by the compiler, then reviewed.
# content hash: sha256:ac1a88a3ec2072ae7bab01cc4145b66be1ed911cede496d8e35f04312851bdd4
schema: understudy/capability@1
id: keystone.member.open_share_account
version: 1.0.0
title: Open a share sub-account for a member
description: For member {{inputs.member_id}}, open a new sub-account of product {{inputs.product}} with the account
  nickname {{inputs.nickname}} and an opening deposit of {{inputs.opening_deposit}}, funded from the member's existing
  account with suffix {{inputs.fund_from}}. Continue to the review screen. On the review screen, first read the
  dividend rate, then ask a human operator to approve and perform the final confirmation, which is irreversible
  and not yours to do. When the operator hands back, read the confirmation number and the new account suffix from
  the confirmation screen, and finish.
status: verified
app:
  product: keystone-core
  profile: keystone-core@7
  versions: '>=7.0,<8'
risk: irreversible
inputs:
  member_id:
    description: Member number (4 to 10 digits)
    type: string
    pattern: ^[0-9]{4,10}$
    sensitivity: internal
    example: '100234'
  product:
    description: Share product to open
    type: enum
    enum:
    - Share Savings
    - Money Market Share
    - Holiday Club
    - Share Certificate 12 Mo
    sensitivity: public
    example: Money Market Share
  nickname:
    description: Account nickname shown to the member (max 20 characters)
    type: string
    pattern: ^.{1,20}$
    sensitivity: internal
    example: Rainy day fund
  opening_deposit:
    description: Opening deposit amount, moved from the funding account
    type: money
    minimum: '0'
    sensitivity: financial
  fund_from:
    description: Suffix of the member's funding account, e.g. 00
    type: string
    pattern: ^[0-9]{2}$
    sensitivity: internal
    example: '00'
outputs:
  dividend_rate:
    description: Dividend rate of the new account as shown on the review screen
    type: string
    sensitivity: public
    source:
      description: value next to the label "Dividend Rate" in the main frame
      within:
      - frame: main
      locators:
      - by: label
        label: Dividend Rate
        role: cell
        why: the label printed next to the field; survives layout changes; tenant relabels go through vocabulary
  confirmation_number:
    description: Confirmation number issued when the account was opened
    type: string
    sensitivity: internal
    source:
      description: value next to the label "Confirmation Number" in the main frame
      within:
      - frame: main
      locators:
      - by: label
        label: Confirmation Number
        role: cell
        why: the label printed next to the field; survives layout changes; tenant relabels go through vocabulary
  new_suffix:
    description: Suffix of the newly opened sub-account
    type: string
    sensitivity: internal
    source:
      description: value next to the label "New Suffix" in the main frame
      within:
      - frame: main
      locators:
      - by: label
        label: New Suffix
        role: cell
        why: the label printed next to the field; survives layout changes; tenant relabels go through vocabulary
outcomes:
- code: MEMBER_NOT_FOUND
  description: No member has this member number.
  condition: record_not_found
- code: MEMBER_RESTRICTED
  description: The member record is restricted; no new accounts may be opened.
  condition: member_restricted
- code: PERMISSION_DENIED
  description: The service account may not open sub-accounts.
  condition: access_denied
- code: DEPOSIT_REJECTED
  description: The application rejected the product, deposit, or funding account (message says why).
  condition: validation_error
- code: ADDRESS_VERIFICATION_PENDING
  description: The member has an unverified address change; verify it before opening accounts.
  condition: address_verification_pending
