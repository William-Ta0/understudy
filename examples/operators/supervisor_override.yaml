# Simulated supervisor: resolves the supervisor-override screen (a human_required condition) by taking
# control of the live session and typing credentials, then approves the irreversible confirmation.
# The override code comes from $KEYSTONE_SUPERVISOR_CODE, never from this file.
operator: sup.kim
handlers:
  - on: human_required
    think_s: 1.5
    actions:
      - click: {role: textbox, label: Supervisor ID}
      - type: sup_kim
      - click: {role: textbox, label: Override Code}
      - type_env: KEYSTONE_SUPERVISOR_CODE
      - click: {role: button, name: Submit Override}
    release: {resolution: resume, note: Supervisor authorised the deposit at the workstation.}
  - on: approval
    think_s: 1.0
    release: {resolution: approve, note: Member confirmed the details.}
