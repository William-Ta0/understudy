# Simulated operator for discovery of open_share_account: performs the irreversible confirmation
# that policy forbids the model to do, in the same live session, then hands control back.
operator: ops.jlee
handlers:
  - kind: approval
    think_s: 1.5
    actions:
      - click: {role: button, name: "Confirm & Open Account"}
    release: {resolution: completed, note: Details confirmed with the member; account opened.}
