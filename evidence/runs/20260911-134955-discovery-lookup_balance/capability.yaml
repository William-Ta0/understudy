schema: understudy/capability@1
id: keystone.member.lookup_balance
version: 1.0.0
title: Look up a member's savings balance
description: Look up member {{inputs.member_id}} and read the current balance and the available balance of the member's
  primary savings account (the "Share Savings" account), and the member's name as shown on the member record.
status: verified
outputs:
  member_name:
    description: The member's name as shown on the member record
    type: string
    sensitivity: pii
    source:
      description: value next to the label "Name" in the main frame
      within:
      - frame: main
      locators:
      - by: label
        label: Name
        role: cell
        why: the label printed next to the field; survives layout changes; tenant relabels go through vocabulary
  savings_balance:
    description: Current balance of the member's Share Savings account
    type: money
    sensitivity: financial
    source:
      description: '"Current Balance" cell of the row where Description = Share Savings in the main frame'
      within:
      - frame: main
      locators:
      - by: table_cell
        headers:
        - Description
        - Current Balance
        row:
          Description: Share Savings
        column: Current Balance
        why: a grid value by column header and row key, never by position
  available_balance:
    description: Available balance of the member's Share Savings account
    type: money
    sensitivity: financial
    source:
      description: '"Available Balance" cell of the row where Description = Share Savings in the main frame'
      within:
      - frame: main
      locators:
      - by: table_cell
        headers:
        - Description
        - Available Balance
        row:
          Description: Share Savings
        column: Available Balance
        why: a grid value by column header and row key, never by position
risk: reversible
app:
  product: keystone-core
  profile: keystone-core@7
  versions: '>=7.0,<8'
inputs:
  member_id:
    description: Member number (4 to 10 digits)
    type: string
    pattern: ^[0-9]{4,10}$
    sensitivity: internal
    example: '100234'
outcomes:
- code: MEMBER_NOT_FOUND
  description: No member has this member number.
  condition: record_not_found
- code: MEMBER_RESTRICTED
  description: The member record is restricted and balances are withheld. Refer the request to a supervisor.
  condition: member_restricted
- code: PERMISSION_DENIED
  description: The service account is not allowed to use member inquiry.
  condition: access_denied
- code: INVALID_MEMBER_NUMBER
  description: The application rejected the member number.
  condition: validation_error
entry:
  screen: workstation_home
