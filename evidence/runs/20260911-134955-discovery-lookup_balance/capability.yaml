  action: click
  intent: Click on Member Inquiry button to access member lookup functionality
  screen: workstation_home
  target:
    description: button "Member Inquiry" in the nav frame
    within:
    - frame: nav
    locators:
    - by: role
      role: button
      name: Member Inquiry
      why: 'role + accessible name: what the operator reads; survives layout and generated-id changes'
    - by: attr
      tag: td
      attrs:
        onclick:
          value: mbrinq.asp
